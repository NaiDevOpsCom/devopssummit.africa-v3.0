# .github/workflows/node-version-update.yml
#
# Automatically tracks Node.js LTS patch releases and opens a PR when a
# new patch is available for any of our supported LTS lines.
#
# This mirrors what Dependabot does for npm packages, but for the Node.js
# runtime itself — which Dependabot does not natively support.
#
# What gets updated when a new patch is found:
#   ✅ package.json  → engines.node   (e.g. "^22.22.3 || ^24.16.0")
#   ✅ ci.yml        → NODE_VERSION   (tracks the active LTS major)
#   ✅ .nvmrc        → pinned to the latest active LTS patch
#
# How to configure which LTS lines are tracked:
#   Edit SUPPORTED_LTS_MAJORS inside scripts/update-node-engine.mjs
#   (maintenance and active majors)
#
# Required repository secret:  none (uses the built-in GITHUB_TOKEN)
# Required repository setting: Actions → Workflow permissions → "Read and
#                              write permissions" must be enabled, OR a PAT
#                              with repo + workflow scopes stored as
#                              NODE_UPDATE_TOKEN secret.

name: 🔄 Node.js Engine Update

on:
  schedule:
    # Every Monday at 08:00 Nairobi time (05:00 UTC) — same slot as Dependabot
    - cron: "0 5 * * 1"

  # Allow maintainers to trigger a check on demand
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (print changes but do not create a PR)"
        required: false
        default: false
        type: boolean

concurrency:
  # Only one node-version-update workflow at a time
  group: node-version-update
  cancel-in-progress: false

permissions:
  contents: write # needed to push the branch
  pull-requests: write # needed to open the PR

jobs:
  check-and-update:
    name: 🔍 Check for newer Node.js LTS patches
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Use PAT if available (required to push branches that trigger CI).
          # Falls back to GITHUB_TOKEN, which works for pushing but PRs opened
          # by GITHUB_TOKEN won't re-trigger CI checks automatically.
          token: ${{ secrets.NODE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Setup Node (use the version already in .nvmrc / package.json) ──
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Bootstrap with the version currently declared in .nvmrc;
          # if .nvmrc does not exist yet, fall back to Node 22 (maintenance LTS)
          node-version-file: ".nvmrc"
          node-version: "22" # fallback only — overridden when .nvmrc exists

      # ── 3. Run the update script ───────────────────────────────────────────
      - name: Run Node.js engine update script
        id: update
        # The script exits 0 = no changes, 1 = changes made, 2 = error.
        # We capture exit code 1 as "success with changes" using || true,
        # then inspect the GITHUB_OUTPUT variable in the next step.
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in dry-run mode — no files will be written"
          fi

          # Run script; capture exit code without failing the job
          node scripts/update-node-engine.mjs $DRY_RUN_FLAG && EXIT_CODE=0 || EXIT_CODE=$?

          echo "Script exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "❌ Script encountered a fatal error"
            exit 2
          fi

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Nothing to do ──────────────────────────────────────────────────
      - name: ✅ Already up to date
        if: steps.update.outputs.changes_made == 'false'
        run: echo "Node.js LTS versions in package.json are already up to date."

      # ── 5. Commit + push branch ───────────────────────────────────────────
      - name: Configure git identity
        if: steps.update.outputs.changes_made == 'true' && inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create update branch
        id: branch
        if: steps.update.outputs.changes_made == 'true' && inputs.dry_run != 'true'
        run: |
          BRANCH_NAME="chore/node-engine-update-$(date +%Y%m%d)"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          # Delete existing branch with the same name (from a prior run today)
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git add package.json .nvmrc .github/workflows/ci.yml

          MAINTENANCE_VERSION="${{ steps.update.outputs.maintenance_version }}"
          ACTIVE_VERSION="${{ steps.update.outputs.active_version }}"

          if [ "$MAINTENANCE_VERSION" = "$ACTIVE_VERSION" ]; then
            COMMIT_MSG="chore(node): update Node.js engine to latest LTS patches"$'\n\n'
            COMMIT_MSG="${COMMIT_MSG}- Node.js LTS (Node ${ACTIVE_VERSION}): updated minimum patch + .nvmrc"$'\n\n'
            COMMIT_MSG="${COMMIT_MSG}Automated by: .github/workflows/node-version-update.yml"$'\n'
            COMMIT_MSG="${COMMIT_MSG}Source: https://nodejs.org/en/about/previous-releases"
          else
            COMMIT_MSG="chore(node): update Node.js engine to latest LTS patches"$'\n\n'
            COMMIT_MSG="${COMMIT_MSG}- Maintenance LTS (Node ${MAINTENANCE_VERSION}): updated minimum patch"$'\n'
            COMMIT_MSG="${COMMIT_MSG}- Active LTS (Node ${ACTIVE_VERSION}): updated minimum patch + .nvmrc"$'\n\n'
            COMMIT_MSG="${COMMIT_MSG}Automated by: .github/workflows/node-version-update.yml"$'\n'
            COMMIT_MSG="${COMMIT_MSG}Source: https://nodejs.org/en/about/previous-releases"
          fi

          git commit -m "$COMMIT_MSG"

          git push origin "$BRANCH_NAME"
          echo "✅ Branch pushed: $BRANCH_NAME"

      # ── 6. Open / update Pull Request ─────────────────────────────────────
      - name: Create Pull Request
        if: steps.update.outputs.changes_made == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.NODE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MAINTENANCE_VERSION="${{ steps.update.outputs.maintenance_version }}"
          ACTIVE_VERSION="${{ steps.update.outputs.active_version }}"
          HAS_SECURITY="${{ steps.update.outputs.has_security }}"
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          SECURITY_NOTE=""
          if [ "$HAS_SECURITY" = "true" ]; then
            SECURITY_NOTE="🔐 **This update includes a security release.** Priority merge recommended."$'\n\n'
          fi

          if [ "$MAINTENANCE_VERSION" = "$ACTIVE_VERSION" ]; then
            ENGINES_VAL="\`^${ACTIVE_VERSION}\`"
          else
            ENGINES_VAL="\`^${MAINTENANCE_VERSION} || ^${ACTIVE_VERSION}\`"
          fi

          cat <<EOF > pr_body.md
          ${SECURITY_NOTE}## What changed

          Updates the Node.js engine requirement in \`package.json\`, the CI runner version in \`ci.yml\`, and \`.nvmrc\` to the latest LTS patches.

          | File | Field | Value |
          |------|-------|-------|
          | \`package.json\` | \`engines.node\` | ${ENGINES_VAL} |
          | \`ci.yml\` | \`NODE_VERSION\` | \`${{ steps.update.outputs.active_major }}\` |
          | \`.nvmrc\` | — | \`${ACTIVE_VERSION}\` |

          ## Why

          Node.js releases security and stability patches on a regular schedule.
          Keeping the minimum engine version pinned to the latest patch ensures:

          - Contributors aren't running vulnerable Node versions unknowingly.
          - CI always tests against a patched runtime.
          - Tools like \`npm install\` can warn when a user's Node is below the minimum.

          ## Checklist for reviewer

          - [ ] Check the [Node.js changelog](https://github.com/nodejs/node/blob/main/CHANGELOG.md) for any breaking changes in this patch range.
          - [ ] Confirm CI passes on this branch before merging.
          - [ ] If this is a **security release**, merge promptly.

          ____
          *Automated by [\`.github/workflows/node-version-update.yml\`](../../blob/staging/.github/workflows/node-version-update.yml)*
          EOF

          PR_TITLE="chore(node): update Node.js engine to latest LTS patches"

          # Check if a PR for this branch already exists
          EXISTING_PR=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file pr_body.md
          else
            echo "Opening new PR from $BRANCH → staging"
            gh pr create \
              --base staging \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file pr_body.md \
              --label "dependencies" \
              --label "automated" \
              --label "node-engine" 2>/dev/null || \
            gh pr create \
              --base staging \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file pr_body.md
              # Note: if labels don't exist, the second fallback runs without them.
              # Create labels once via: gh label create "node-engine" --color "0075ca" --description "Node.js runtime version update"
          fi

          echo "✅ Pull request created/updated."
